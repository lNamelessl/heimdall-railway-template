# Heimdall on Railway - nginx site conf.
#
# Derived from the stock linuxserver baseimage default.conf.sample (2024/07/16)
# with two template changes, both applied idempotently by
# railway-entrypoint.sh on every boot:
#   1. basic auth ENABLED (both stock auth blocks uncommented) -
#      credentials come from the DASHBOARD_USER/DASHBOARD_PASSWORD variables
#   2. an unauthenticated /healthz route for the Railway healthcheck
# This file is only copied into /config/nginx/site-confs/default.conf when
# that file does not exist (first boot on a fresh volume) - edits you make to
# the file on the volume are never overwritten.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    # BEGIN RAILWAY HEALTHZ (managed by the Railway template - safe to delete)
    location = /healthz { auth_basic off; access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
    # END RAILWAY HEALTHZ

    include /config/nginx/ssl.conf;

    set $root /app/www/public;
    if (!-d /app/www/public) {
        set $root /config/www;
    }
    root $root;
    index index.html index.htm index.php;

    location / {
        # enabled by the Railway template (was: enable for basic auth)
        auth_basic "Restricted";
        auth_basic_user_file /config/nginx/.htpasswd;

        try_files $uri $uri/ /index.html /index.htm /index.php$is_args$args;
    }

    location ~ ^(.+\.php)(.*)$ {
        # enabled by the Railway template (was: enable the next two lines for http auth)
        auth_basic "Restricted";
        auth_basic_user_file /config/nginx/.htpasswd;

        fastcgi_split_path_info ^(.+\.php)(.*)$;
        if (!-f $document_root$fastcgi_script_name) { return 404; }
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include /etc/nginx/fastcgi_params;
    }

    # deny access to .htaccess/.htpasswd files
    location ~ /\.ht {
        deny all;
    }
}
